# Dependabot opens a pull request when a package (or a GitHub Action) has an update, and right away
# when one has a known security hole. CI tests each one before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /grownd-main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
