document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

play:inline-block;overflow:hidden;vertical-align:top;padding-bottom:0.1em;margin-bottom:-0.1em\"><span class=\"gr-anim\" style=\"display:inline-block;animation:grWordIn 850ms cubic-bezier(.2,.8,.2,1) 170ms both\">a<\u002Fspan><\u002Fspan> <span style=\"display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:0.1em;margin-bottom:-0.1em\"><span class=\"gr-anim\" style=\"display:inline-block;animation:grWordIn 850ms cubic-bezier(.2,.8,.2,1) 220ms both\">scientist.<\u002Fspan><\u002Fspan> <span style=\"display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:0.1em;margin-bottom:-0.1em;color:var(--muted,#9FACC9)\"><span class=\"gr-anim\" style=\"display:inline-block;animation:grWordIn 850ms cubic-bezier(.2,.8,.2,1) 340ms both\">Some<\u002Fspan><\u002Fspan> <span style=\"display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:0.1em;margin-bottom:-0.1em;color:var(--muted,#9FACC9)\"><span class=\"gr-anim\" style=\"display:inline-block;animation:grWordIn 850ms cubic-bezier(.2,.8,.2,1) 400ms both\">just<\u002Fspan><\u002Fspan> <span style=\"display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:0.1em;margin-bottom:-0.1em;color:var(--muted,#9FACC9)\"><span class=\"gr-anim\" style=\"display:inline-block;animation:grWordIn 850ms cubic-bezier(.2,.8,.2,1) 460ms both\">need<\u002Fspan><\u002Fspan> <span style=\"display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:0.1em;margin-bottom:-0.1em;color:var(--muted,#9FACC9)\"><span class=\"gr-anim\" style=\"display:inline-block;animation:grWordIn 850ms cubic-bezier(.2,.8,.2,1) 520ms both\">a<\u002Fspan><\u002Fspan> <span style=\"display:inline-block;transform:rotate(-2deg)\"><span class=\"gr-anim\" style=\"display:inline-block;padding:0 0.14em 0.04em;border-radius:18px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);animation:grPop 700ms cubic-bezier(.2,.8,.2,1) 680ms both\">lab.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-size:clamp(17px,1.4vw,19px);line-height:1.55;color:var(--muted,#9FACC9);max-width:540px;text-wrap:pretty\">Hands-on STEM missions for ages 5 to 12: birthdays, workshops, school events and coding sessions. We bring the kit, the scientists and the clean-up. You bring the children.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<a data-magnet=\"\" href=\"#/register\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:14px 26px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;text-decoration:none;transition:box-shadow 150ms ease,transform 150ms ease,gap 150ms ease\" style-hover=\"box-shadow:0 0 32px rgba(198,245,52,0.35);transform:translateY(-2px);gap:14px;color:var(--on-accent,#0A0E1A)\" style-active=\"transform:scale(0.97)\">Book a science experience {{ ic.arrow }}<\u002Fa>\n<a data-magnet=\"\" href=\"#/missions\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:14px 26px;border-radius:14px;border:2px solid var(--hair-strong,#6B7CAB);color:var(--ink,#F2F5FF);font-size:16px;font-weight:700;text-decoration:none;transition:border-color 150ms ease,background 150ms ease,gap 150ms ease\" style-hover=\"border-color:var(--ink,#F2F5FF);background:var(--surface,#121829);gap:14px;color:var(--ink,#F2F5FF)\" style-active=\"transform:scale(0.97)\">Enter the Lab {{ ic.arrow }}<\u002Fa>\n<\u002Fdiv>\n<dl aria-label=\"At a glance\" style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--hair,#2C3757);border:1px solid var(--hair,#2C3757);border-radius:14px;overflow:hidden\">\n<div style=\"padding:14px 16px;background:rgba(var(--surface-rgb,14,19,34),0.6)\"><dt style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">AGES<\u002Fdt><dd style=\"margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">5-12<\u002Fdd><\u002Fdiv>\n<div style=\"padding:14px 16px;background:rgba(var(--surface-rgb,14,19,34),0.6)\"><dt style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">LENGTH<\u002Fdt><dd style=\"margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">90-120 min<\u002Fdd><\u002Fdiv>\n<div style=\"padding:14px 16px;background:rgba(var(--surface-rgb,14,19,34),0.6)\"><dt style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">FROM<\u002Fdt><dd style=\"margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ fromPrice }}<\u002Fdd><\u002Fdiv>\n<div style=\"padding:14px 16px;background:rgba(var(--surface-rgb,14,19,34),0.6)\"><dt style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">KIT<\u002Fdt><dd style=\"margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">We bring it all<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n\n<div style=\"position:relative;border-radius:24px;background:rgba(var(--surface-rgb,18,24,41),0.55);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.12);box-shadow:0 30px 80px rgba(var(--shadow-rgb,4,7,16),0.6);padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;gap:14px;min-width:0\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;font-weight:500\"><span style=\"display:inline-flex;align-items:center;gap:8px;color:var(--brand-ink,#C6F534)\"><span style=\"width:8px;height:8px;border-radius:2px;background:var(--brand,#C6F534)\"><\u002Fspan>REACTION RIG / TRY IT<\u002Fspan><span style=\"color:var(--muted,#9FACC9)\">SAMPLES {{ rig.count }} / 3<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative;border-radius:14px;background:#0A0E1A;border:1px solid #2C3757;overflow:hidden;aspect-ratio:1/0.86\">\n<div ref=\"{{ artRef }}\" style=\"position:absolute;inset:0;transition:transform 700ms cubic-bezier(.2,.7,.2,1)\">{{ rig.svg }}<\u002Fdiv>\n{{ rig.burst }}\n<span style=\"position:absolute;left:12px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#9FACC9\">{{ rig.mix }}<\u002Fspan>\n<\u002Fdiv>\n<p aria-live=\"polite\" style=\"margin:0;min-height:48px;font-size:16px;line-height:24px\">{{ rig.msg }}<\u002Fp>\n<div role=\"group\" aria-label=\"Add a sample\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n<sc-for list=\"{{ rig.tubes }}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" data-cursor=\"ADD\" sc-camel-on-click=\"{{ t.add }}\" aria-label=\"{{ t.aria }}\" disabled=\"{{ t.disabled }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:10px;min-height:108px;padding:14px 4px 12px;border-radius:14px;background:rgba(var(--raised-rgb,27,35,64),0.52);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);color:var(--ink,#F2F5FF);cursor:pointer;opacity:{{ t.opacity }};transition:transform 220ms cubic-bezier(.2,.7,.2,1),border-color 150ms ease,background 150ms ease\" style-hover=\"transform:translateY(-5px) rotate(-8deg);border-color:var(--hair-strong,#6B7CAB);background:var(--raised,#222B4C)\" style-active=\"transform:scale(0.95)\">\n<span class=\"gr-anim\" style=\"transform-origin:50% 0;animation:{{ t.wiggle }};position:relative;width:20px;height:52px;border:2px solid var(--ink,#F2F5FF);border-top:0;border-radius:0 0 999px 999px;overflow:hidden\"><span style=\"position:absolute;left:0;right:0;bottom:0;height:62%;background:{{ t.color }}\"><\u002Fspan><\u002Fspan>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.04em;font-weight:500;text-transform:uppercase\">{{ t.name }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ rig.done }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<a href=\"#/quiz\" style=\"flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;text-decoration:none\" style-hover=\"box-shadow:0 0 32px rgba(198,245,52,0.35);color:var(--on-accent,#0A0E1A)\">Take the real quiz {{ ic.arrow }}<\u002Fa>\n<button type=\"button\" sc-camel-on-click=\"{{ rig.reset }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid var(--hair-strong,#6B7CAB);background:transparent;color:var(--ink,#F2F5FF);font-size:16px;font-weight:700;cursor:pointer\" style-hover=\"border-color:var(--ink,#F2F5FF)\">{{ ic.refresh }} Reset the rig<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div aria-hidden=\"true\" style=\"overflow:hidden;border-top:1px solid var(--hair,#2C3757);border-bottom:1px solid var(--hair,#2C3757);padding:20px 0;background:var(--deep,#0A0E1A)\"><div ref=\"{{ tickRef }}\" style=\"transition:transform 500ms cubic-bezier(.2,.7,.2,1)\">{{ ticker }}<\u002Fdiv><\u002Fdiv>\n\n<section style=\"width:100%;max-width:1440px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(20px,4vw,48px) clamp(56px,7vw,96px);display:flex;flex-direction:column;gap:36px\">\n<div data-reveal=\"\" style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.08em;color:var(--brand-ink,#C6F534)\" data-scramble=\"1\">STEP 01 / THE PERIODIC TABLE OF PARTIES<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(40px,5.4vw,76px);line-height:0.95;font-weight:700;letter-spacing:-0.03em\">Choose your mission<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:var(--muted,#9FACC9);max-width:520px\">Six elements. Every one is hands-on and every one comes with its own scientists. Hover to react.<\u002Fp>\n<\u002Fdiv>\n<a href=\"#/missions\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--brand-ink,#C6F534);font-size:16px;font-weight:700;text-decoration:none\" style-hover=\"color:var(--ink,#F2F5FF)\">See all six missions {{ ic.arrow }}<\u002Fa>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px\">\n<sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"6\">\n<a data-reveal=\"\" data-cursor=\"REACT\" href=\"{{ c.href }}\" style=\"transition-delay:{{ c.delay }};position:relative;display:flex;flex-direction:column;gap:6px;min-height:250px;padding:18px 20px 20px;border-radius:24px;background:rgba(var(--raised-rgb,27,35,64),0.52);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);color:var(--ink,#F2F5FF);text-decoration:none;transition-property:opacity,transform,background,color,box-shadow;transition-duration:400ms,300ms,200ms,200ms,200ms\" style-hover=\"background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 0 40px rgba(198,245,52,0.35)\">\n<span style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.08em\"><span>{{ c.num }}<\u002Fspan><span style=\"opacity:0.8;font-weight:500\">{{ c.count }}<\u002Fspan><\u002Fspan>\n<span class=\"gr-anim\" style=\"animation:grFloat 4.5s ease-in-out infinite;animation-delay:{{ c.fdelay }};margin-top:14px;font-family:'Space Grotesk',sans-serif;font-size:72px;line-height:0.9;font-weight:700;letter-spacing:-0.03em\">{{ c.sym }}<\u002Fspan>\n<span style=\"margin-top:auto;font-family:'Space Grotesk',sans-serif;font-size:19px;line-height:26px;font-weight:600\">{{ c.name }}<\u002Fspan>\n<span style=\"font-size:14px;line-height:21px;opacity:0.82\">{{ c.line }}<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p data-reveal=\"\" style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--muted,#9FACC9)\" data-scramble=\"1\">KEY: NUMBER / SYMBOL / CATEGORY / MISSIONS AVAILABLE<\u002Fp>\n<\u002Fsection>\n\n<section style=\"width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(64px,8vw,112px)\">\n<div data-reveal=\"\" style=\"position:relative;overflow:hidden;padding:clamp(28px,5vw,64px);border-radius:24px;background:rgba(var(--surface-rgb,18,24,41),0.5);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.09);display:grid;grid-template-columns:{{ lay.bandCols }};gap:clamp(32px,5vw,64px);align-items:center\">\n<div aria-hidden=\"true\" style=\"position:absolute;left:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:1px solid var(--hair,#2C3757)\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position:absolute;left:-60px;bottom:-100px;width:300px;height:300px;border-radius:50%;border:1px solid var(--hair,#2C3757)\"><\u002Fdiv>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:20px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;line-height:18px;font-weight:500;letter-spacing:0.08em;color:var(--brand-ink,#C6F534)\" data-scramble=\"1\">STEP 02 / 6 QUESTIONS / 2 MINUTES<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(40px,5.4vw,72px);line-height:0.95;font-weight:700;letter-spacing:-0.03em\">What kind of scientist are you?<\u002Fh2>\n<p style=\"margin:0;font-size:18px;line-height:28px;color:var(--muted,#9FACC9);max-width:500px\">Six questions, no wrong answers, four possible scientist types. Each one points at the missions that suit it. Nothing is stored, so let them take it twice.<\u002Fp>\n<a data-magnet=\"\" href=\"#/quiz\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:14px 26px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;text-decoration:none;transition:box-shadow 150ms ease,transform 150ms ease,gap 150ms ease\" style-hover=\"box-shadow:0 0 32px rgba(198,245,52,0.35);transform:translateY(-2px);gap:14px;color:var(--on-accent,#0A0E1A)\">Start the quiz {{ ic.arrow }}<\u002Fa>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--muted,#9FACC9)\">HOVER OR TAB TO A CARD TO READ ITS FILE<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"4\">\n<a href=\"#/quiz\" data-cursor=\"QUIZ\" aria-label=\"{{ t.aria }}\" sc-camel-on-mouse-enter=\"{{ t.enter }}\" sc-camel-on-mouse-leave=\"{{ t.leave }}\" sc-camel-on-focus=\"{{ t.enter }}\" sc-camel-on-blur=\"{{ t.leave }}\" class=\"gr-anim\" style=\"display:block;aspect-ratio:1/0.9;perspective:1000px;text-decoration:none;color:var(--on-accent,#0A0E1A);animation:grFloat 6s ease-in-out infinite;animation-delay:{{ t.fdelay }}\">\n<span style=\"position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transform:{{ t.rot }};transition:transform 700ms cubic-bezier(.2,.7,.2,1)\">\n<span style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:{{ t.color }};padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;justify-content:space-between\">\n<span style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;font-weight:500\"><span>TYPE {{ t.num }}<\u002Fspan><span>FILE<\u002Fspan><\u002Fspan>\n<span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(52px,6vw,88px);line-height:0.85;font-weight:700\">{{ t.initial }}<\u002Fspan>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;line-height:16px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase\">{{ t.name }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);border-radius:24px;background:{{ t.color }};padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;justify-content:space-between\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;line-height:16px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase\">{{ t.name }}<\u002Fspan>\n<span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(16px,1.5vw,20px);line-height:1.2;font-weight:700\">{{ t.tag }}<\u002Fspan>\n<\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(64px,8vw,112px);display:flex;flex-direction:column;gap:20px\">\n<span data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.08em;color:var(--brand-ink,#C6F534)\" data-scramble=\"1\">NEXT MISSION / YOUR TICKET<\u002Fspan>\n<div data-reveal=\"\" style=\"position:relative;display:grid;grid-template-columns:{{ lay.ticketCols }};border-radius:24px;background:rgba(var(--raised-rgb,27,35,64),0.52);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);box-shadow:0 y:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">LENGTH<\u002Fdt><dd style=\"margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ next.lenText }}<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n<span aria-hidden=\"true\" style=\"width:180px;height:40px;opacity:0.7;background:repeating-linear-gradient(90deg,var(--ink,#F2F5FF) 0 2px,transparent 2px 5px,var(--ink,#F2F5FF) 5px 6px,transparent 6px 9px,var(--ink,#F2F5FF) 9px 12px,transparent 12px 14px)\"><\u002Fspan>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<a href=\"{{ next.href }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;color:var(--brand-ink,#C6F534);font-size:16px;font-weight:700;text-decoration:none\" style-hover=\"color:var(--ink,#F2F5FF)\">See this mission<\u002Fa>\n<a data-magnet=\"\" href=\"{{ next.registerHref }}\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:12px 24px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;text-decoration:none;transition:box-shadow 150ms ease,gap 150ms ease\" style-hover=\"box-shadow:0 0 32px rgba(198,245,52,0.35);gap:14px;color:var(--on-accent,#0A0E1A)\">Book mission {{ ic.arrow }}<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(64px,8vw,112px);display:flex;flex-direction:column;gap:32px\">\n<div data-reveal=\"\" style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;gap:14px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.08em;color:var(--brand-ink,#C6F534)\" data-scramble=\"1\">FEATURED MISSIONS / 3 OF 6<\u002Fspan><h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,4.8vw,64px);line-height:0.98;font-weight:700;letter-spacing:-0.03em;max-width:860px\">A party where the cake is the second best bit.<\u002Fh2><\u002Fdiv>\n<a href=\"#/missions\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--brand-ink,#C6F534);font-size:16px;font-weight:700;text-decoration:none\" style-hover=\"color:var(--ink,#F2F5FF)\">Browse all missions {{ ic.arrow }}<\u002Fa>\n<\u002Fdiv>\n<span style=\"display:{{ lay.swipeDisplay }};margin-top:-16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--muted,#9FACC9)\">SWIPE FOR MORE<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:{{ lay.featCols }};grid-auto-flow:{{ lay.featFlow }};grid-auto-columns:{{ lay.featAuto }};overflow-x:{{ lay.featOverflow }};scroll-snap-type:x mandatory;scrollbar-width:none;gap:clamp(16px,2.4vw,32px);padding-bottom:8px\">\n<sc-for list=\"{{ featured }}\" as=\"item\" hint-placeholder-count=\"3\"><div data-reveal=\"\" style=\"transition-delay:{{ item.delay }};scroll-snap-align:start\"><dc-import name=\"MissionCard\" m=\"{{ item }}\" mobile=\"{{ mob }}\" hint-size=\"100%,460px\"><\u002Fdc-import><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(80px,9vw,128px)\">\n<a data-reveal=\"\" data-cursor=\"ENTER\" href=\"#/missions\" style=\"position:relative;display:flex;flex-direction:column;gap:24px;overflow:hidden;border-radius:24px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);padding:clamp(28px,5vw,72px);text-decoration:none;transition-property:opacity,transform,box-shadow\" style-hover=\"color:var(--on-accent,#0A0E1A);box-shadow:0 0 60px rgba(198,245,52,0.35)\">\n<span aria-hidden=\"true\" class=\"gr-anim\" style=\"position:absolute;inset:-20px;background-image:radial-gradient(rgba(var(--deep-rgb,10,14,26),0.10) 2px,transparent 2.6px);background-size:22px 22px;animation:grDots 30s linear infinite\"><\u002Fspan>\n<span style=\"position:relative;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\" data-scramble=\"1\">STEP 03 / YOUR MOVE<\u002Fspan>\n<span style=\"position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(56px,10vw,168px);line-height:0.85;font-weight:700;letter-spacing:-0.045em\">Enter the Lab<\u002Fspan><span style=\"width:clamp(72px,8vw,120px);height:clamp(72px,8vw,120px);border-radius:999px;background:var(--deep,#0A0E1A);color:var(--brand-ink,#C6F534);display:inline-flex;align-items:center;justify-content:center;flex:none\">{{ ic.arrowXL }}<\u002Fspan><\u002Fspan>\n<span style=\"position:relative;font-size:18px;line-height:28px;max-width:560px\">Six missions for ages 5 to 12. We bring the kit, the scientists and the clean-up, including the ceiling.<\u002Fspan>\n<\u002Fa>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.missions }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"width:100%;max-width:1440px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,4vw,48px) clamp(64px,8vw,96px);display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:900px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.08em;color:var(--brand-ink,#C6F534)\">MISSIONS / 6 AVAILABLE<\u002Fspan>\n<h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,4.6vw,56px);line-height:1.02;font-weight:700;letter-spacing:-0.02em;text-wrap:balance\">Six missions. Pick the one that sounds like your kid.<\u002Fh1>\n<p style=\"margin:0;font-size:18px;line-height:28px;color:var(--muted,#9FACC9)\">Not sure? <a href=\"#/quiz\" style=\"color:var(--brand-ink,#C6F534);font-weight:700\">Take the two-minute scientist quiz<\u002Fa> and we will point you at the right one.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--hair,#2C3757);border-bottom:1px solid var(--hair,#2C3757)\">\n<nav aria-label=\"Filter by category\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ ms.chips }}\" as=\"c\" hint-placeholder-count=\"7\">\n<a href=\"{{ c.href }}\" aria-current=\"{{ c.current }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.border }};font-size:15px;font-weight:600;text-decoration:none;transition:border-color 150ms ease,background 150ms ease\" style-hover=\"border-color:var(--ink,#F2F5FF);color:{{ c.fg }}\">{{ c.name }}<\u002Fa>\n<\u002Fsc-for>\n<\u002Fnav>\n<label style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">CITY<\u002Fspan>\n<span style=\"position:relative;display:inline-flex;align-items:center\"><sc-raw-select value=\"{{ ms.city }}\" sc-camel-on-change=\"{{ ms.onCity }}\" style=\"appearance:none;min-height:48px;min-width:200px;padding:0 44px 0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px;cursor:pointer\"><option value=\"\">All cities<\u002Foption>{{ ms.cityOptions }}<\u002Fsc-raw-select><span style=\"position:absolute;right:14px;pointer-events:none;display:inline-flex\">{{ ic.chev }}<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<\u002Fdiv>\n<p aria-live=\"polite\" style=\"margin:-12px 0 0;font-family:'JetBrains Mono',monospace;font-size:13p turate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);transition-property:opacity,transform,border-color\" style-hover=\"border-color:var(--hair-strong,#6B7CAB)\">\n<span style=\"width:56px;height:56px;border-radius:14px;background:{{ mp.m.color }};color:var(--on-accent,#0A0E1A);display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700\">{{ s.n }}<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:19px;line-height:26px;font-weight:600\">{{ s.title }}<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:26px;color:var(--muted,#9FACC9)\">{{ s.text }}<\u002Fp>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:16px\">\n<div data-reveal=\"\" style=\"padding:clamp(24px,3vw,32px);border-radius:24px;background:rgba(var(--surface-rgb,18,24,41),0.5);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.09);display:flex;flex-direction:column;gap:16px\">\n<h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:30px;font-weight:600\">What is included<\u002Fh2>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:26px\">\n<sc-for list=\"{{ mp.incl }}\" as=\"it\" hint-placeholder-count=\"4\"><li style=\"display:flex;gap:12px\"><span style=\"color:var(--brand-ink,#C6F534);margin-top:1px\">{{ ic.check }}<\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<div data-reveal=\"\" style=\"padding:clamp(24px,3vw,32px);border-radius:24px;background:rgba(var(--surface-rgb,18,24,41),0.5);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255) ace-between;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\"><span>PHONE<\u002Fspan><span style=\"color:var(--muted,#9FACC9)\">OPTIONAL<\u002Fspan><\u002Fspan><input type=\"tel\" sc-camel-auto-complete=\"tel\" value=\"{{ rg.f.phone }}\" sc-camel-on-change=\"{{ rg.set.phone }}\" style=\"min-height:52px;padding:0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px\" style-focus=\"border-color:var(--brand-ink,#C6F534)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\">HOW MANY CHILDREN<\u002Fspan><input type=\"number\" min=\"1\" max=\"32\" value=\"{{ rg.f.kids }}\" sc-camel-on-change=\"{{ rg.set.kids }}\" style=\"min-height:52px;padding:0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px;font-family:'JetBrains Mono',monospace\" style-focus=\"border-color:var(--brand-ink,#C6F534)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\">AGE RANGE<\u002Fspan><span style=\"position:relative;display:flex;align-items:center\"><sc-raw-select value=\"{{ rg.f.age }}\" sc-camel-on-change=\"{{ rg.set.age }}\" style=\"appearance:none;width:100%;min-height:52px;padding:0 44px 0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px;cursor:pointer\"><option value=\"\">Choose an age range<\u002Foption><option value=\"5-8\">5-8<\u002Foption><option value=\"7-11\">7-11<\u002Foption><option value=\"8-12\">8-12<\u002Foption><option value=\"mixed\">Mixed ages, 5-12<\u002Foption><\u002Fsc-raw-select><span style=\"position:absolute;right:14px;pointer-events:none;display:inline-flex\">{{ ic.chev }}<\u002Fspan><\u002Fspan><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\">PREFERRED DATE<\u002Fspan><input type=\"date\" value=\"{{ rg.f.date }}\" sc-camel-on-change=\"{{ rg.set.date }}\" style=\"min-height:52px;padding:0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px;color-scheme:var(--scheme,dark)\" style-focus=\"border-color:var(--brand-ink,#C6F534)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\">CITY<\u002Fspan><input type=\"text\" sc-camel-auto-complete=\"address-level2\" value=\"{{ rg.f.city }}\" sc-camel-on-change=\"{{ rg.set.city }}\" style=\"min-height:52px;padding:0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px\" style-focus=\"border-color:var(--brand-ink,#C6F534)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\">VENUE TYPE<\u002Fspan><span style=\"position:relative;display:flex;align-items:center\"><sc-raw-select value=\"{{ rg.f.venue }}\" sc-camel-on-change=\"{{ rg.set.venue }}\" style=\"appearance:none;width:100%;min-height:52px;padding:0 44px 0 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px;cursor:pointer\"><option>Our home<\u002Foption><option>A hall we have booked<\u002Foption><option>School<\u002Foption><option>Not decided yet<\u002Foption><\u002Fsc-raw-select><span style=\"position:absolute;right:14px;pointer-events:none;display:inline-flex\">{{ ic.chev }}<\u002Fspan><\u002Fspan><\u002Flabel>\n<label style=\"grid-column:{{ lay.span2 }};display:flex;flex-direction:column;gap:8px\"><span style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\"><span>ANYTHING WE SHOULD KNOW<\u002Fspan><span style=\"color:var(--muted,#9FACC9)\">OPTIONAL<\u002Fspan><\u002Fspan><textarea rows=\"3\" value=\"{{ rg.f.notes }}\" sc-camel-on-change=\"{{ rg.set.notes }}\" placeholder=\"Allergies, access, one child who is scared of loud bangs, that sort of thing\" style=\"padding:14px 16px;border-radius:8px;border:1px solid var(--hair-strong,#6B7CAB);background:rgba(var(--deep-rgb,10,14,26),0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink,#F2F5FF);font-size:16px;line-height:26px;resize:vertical\" style-focus=\"border-color:var(--brand-ink,#C6F534)\"><\u002Ftextarea><\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<label style=\"display:flex;gap:14px;align-items:flex-start;padding:20px;border-radius:14px;background:var(--surface,#121829);border:1px solid {{ rg.e.consent.border }};cursor:pointer\"><input type=\"checkbox\" required=\"\" checked=\"{{ rg.f.consent }}\" sc-camel-on-change=\"{{ rg.set.consent }}\" aria-invalid=\"{{ rg.e.consent.inv }}\" style=\"flex:none;width:24px;height:24px;margin:1px 0 0;accent-color:var(--brand-ink,#C6F534);cursor:pointer\"><span style=\"font-size:16px;line-height:26px\">Yes, GROWND can email me about this mission. We do not add you to anything else, and we never store details about your child beyond what is on this form.<\u002Fspan><\u002Flabel>\n<sc-if value=\"{{ rg.e.consent.has }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-size:14px;line-height:20px;color:var(--danger,#FF7A7A)\">{{ rg.e.consent.msg }}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ rg.e.server.has }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-size:14px;line-height:20px;color:var(--danger,#FF7A7A)\">{{ rg.e.server.msg }}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n<button type=\"submit\" disabled=\"{{ rg.sending }}\" aria-busy=\"{{ rg.busy }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:14px 30px;border-radius:14px;border:0;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;cursor:pointer;transition:box-shadow 150ms ease,transform 150ms ease\" style-hover=\"box-shadow:0 0 32px rgba(198,245,52,0.35);transform:translateY(-2px)\" style-active=\"transform:scale(0.98)\">{{ rg.sendLabel }} {{ ic.arrow }}<\u002Fbutton>\n<span style=\"font-size:15px;color:var(--muted,#9FACC9)\">We reply within <span style=\"font-family:'JetBrains Mono',monospace;color:var(--ink,#F2F5FF)\">{{ site.responseTime }}<\u002Fspan>.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fform>\n<aside style=\"display:flex;flex-direction:column;gap:20px;position:{{ lay.bookPos }};top:96px\">\n<sc-if value=\"{{ rg.has }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-radius:24px;background:rgba(var(--raised-rgb,27,35,64),0.52);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);border-top:6px solid {{ rg.m.color }};padding:32px;display:flex;flex-direction:column;gap:20px;box-shadow:0 8px 24px rgba(var(--shadow-rgb,4,7,16),0.45)\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500;color:var(--muted,#9FACC9)\">YOUR MISSION<\u002Fspan>\n<div style=\"display:flex;gap:16px;align-items:center\"><span style=\"width:64px;height:64px;flex:none;border-radius:14px;background:{{ rg.m.color }};color:var(--on-accent,#0A0E1A);display:inline-flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700\">{{ rg.m.no }}<\u002Fspan><div><h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:30px;font-weight:600\">{{ rg.m.title }}<\u002Fh2><div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:var(--muted,#9FACC9);margin-top:4px\">{{ rg.m.agesText }} / {{ rg.m.lenText }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<dl style=\"margin:0;padding-top:20px;border-top:1px solid var(--hair,#2C3757);display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center\">\n<dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">SCIENTIST<\u002Fdt><dd style=\"margin:0;text-align:right\"><span style=\"display:inline-flex;padding:2px 10px;border-radius:999px;background:{{ rg.m.color }};color:var(--on-accent,#0A0E1A);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase\">{{ rg.m.typeName }}<\u002Fspan><\u002Fdd>\n<dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">FROM<\u002Fdt><dd style=\"margin:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ rg.m.price }}<\u002Fdd>\n<dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">CURRENCY<\u002Fdt><dd style=\"margin:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ site.currency }}<\u002Fdd>\n<dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">TIMEZONE<\u002Fdt><dd style=\"margin:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ site.timezone }}<\u002Fdd>\n<\u002Fdl>\n<div style=\"padding-top:20px;border-top:1px solid var(--hair,#2C3757);display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:15px;font-weight:600\">Not this one?<\u002Fspan><div style=\"display:flex;gap:20px;flex-wrap:wrap\"><a href=\"#/missions\" style=\"min-height:44px;display:inline-flex;align-items:center;color:var(--brand-ink,#C6F534);font-weight:700;font-size:15px\">Change mission<\u002Fa><a href=\"#/quiz\" style=\"min-height:44px;display:inline-flex;align-items:center;color:var(--brand-ink,#C6F534);font-weight:700;font-size:15px\">Retake the quiz<\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ rg.none }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-radius:24px;background:rgba(var(--raised-rgb,27,35,64),0.52);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);border-top:6px solid var(--hair-strong,#6B7CAB);padding:32px;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500;color:var(--muted,#9FACC9)\">YOUR MISSION / NOT PICKED<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:30px;font-weight:600\">No mission picked yet<\u002Fh2>\n<p style=\"margin:0;font-size:15px;line-height:24px;color:var(--muted,#9FACC9)\">That is fine. Tell us roughly what you want in the form and we will suggest one. Or let the quiz choose.<\u002Fp>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\"><a href=\"#/missions\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:10px 18px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:15px;font-weight:700;text-decoration:none\">Browse missions<\u002Fa><a href=\"#/quiz\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--hair-strong,#6B7CAB);color:var(--ink,#F2F5FF);font-size:15px;font-weight:700;text-decoration:none\">Take the quiz<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;gap:14px;padding:20px;border-radius:14px;background:rgba(var(--surface-rgb,18,24,41),0.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--hair-strong,#6B7CAB)\"><span>{{ ic.info }}<\u002Fspan><p style=\"margin:0;font-size:14px;line-height:22px\">Nothing is charged here. We confirm availability and the price with you by email.<\u002Fp><\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.sent }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:100%;max-width:1440px;margin:0 auto;padding:clamp(48px,8vw,120px) clamp(20px,4vw,48px);display:flex;justify-content:center\">\n<section role=\"status\" style=\"position:relative;width:100%;max-width:820px;border-radius:24px;background:rgba(var(--raised-rgb,27,35,64),0.52);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.11);border-top:6px solid var(--success,#35D07F);padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;gap:20px;box-shadow:0 16px 40px rgba(var(--shadow-rgb,4,7,16),0.55)\">\n<div style=\"display:flex;align-items:center;gap:12px\"><span ref=\"{{ resRef }}\" style=\"width:44px;height:44px;border-radius:999px;background:var(--success,#35D07F);color:var(--on-accent,#0A0E1A);display:inline-flex;align-items:center;justify-content:center\">{{ ic.check }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500\">DETAILS RECEIVED<\u002Fspan><\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(34px,4.4vw,56px);line-height:1.02;font-weight:700;letter-spacing:-0.02em\">Thanks. A real person takes it from here.<\u002Fh1>\n<p style=\"margin:0;font-size:18px;line-height:28px;color:var(--muted,#9FACC9)\">We reply within <span style=\"font-family:'JetBrains Mono',monospace;color:var(--ink,#F2F5FF)\">{{ site.responseTime }}<\u002Fspan> with dates, a price and a couple of questions about the room.<\u002Fp>\n<dl style=\"margin:0;padding:20px 0;border-top:1px solid var(--hair,#2C3757);border-bottom:1px solid var(--hair,#2C3757);display:flex;flex-wrap:wrap;gap:16px 48px\">\n<div><dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">MISSION<\u002Fdt><dd style=\"margin:4px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ st.mission }}<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">SCIENTIST<\u002Fdt><dd style=\"margin:4px 0 0\"><span style=\"display:inline-flex;padding:2px 10px;border-radius:999px;background:{{ st.color }};color:var(--on-accent,#0A0E1A);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.08em\">{{ st.typeName }}<\u002Fspan><\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9);font-weight:500\">CHILDREN<\u002Fdt><dd style=\"margin:4px 0 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500\">{{ st.kids }}<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<div style=\"display:flex;gap:14px;padding:16px 20px;border-radius:14px;background:rgba(var(--surface-rgb,18,24,41),0.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--hair-strong,#6B7CAB)\"><span>{{ ic.info }}<\u002Fspan><p style=\"margin:0;font-size:14px;line-height:22px\">Your details are saved and with the GROWND team now. Nothing is charged at this stage.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:8px\"><a href=\"#/missions\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;text-decoration:none\" style-hover=\"box-shadow:0 0 32px rgba(198,245,52,0.35);color:var(--on-accent,#0A0E1A)\">Browse more missions<\u002Fa><a href=\"#/quiz\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:14px;border:2px solid var(--hair-strong,#6B7CAB);color:var(--ink,#F2F5FF);font-size:16px;font-weight:700;text-decoration:none\" style-hover=\"border-color:var(--ink,#F2F5FF);color:var(--ink,#F2F5FF)\">Take the scientist quiz<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.notfound }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:100%;max-width:1440px;margin:0 auto;padding:clamp(48px,8vw,120px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;font-weight:500;color:var(--brand-ink,#C6F534)\">ERROR 404 / EXPERIMENT FAILED<\u002Fspan>\n<h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(46px,6.4vw,84px);line-height:0.95;font-weight:700;letter-spacing:-0.025em\">This one did not react.<\u002Fh1>\n<p style=\"margin:0;max-width:600px;font-size:18px;line-height:28px;color:var(--muted,#9FACC9)\">The page you wanted is not here. Good scientists write down what went wrong, so if a GROWND link sent you here, tell us and we will fix it.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:8px\"><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:14px;background:var(--brand,#C6F534);color:var(--on-brand,#0A0E1A);font-size:16px;font-weight:700;text-decoration:none\">Back to the lab<\u002Fa><a href=\"#/missions\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:14px;border:2px solid var(--hair-strong,#6B7CAB);color:var(--ink,#F2F5FF);font-size:16px;font-weight:700;text-decoration:none\">Browse all missions<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div aria-label=\"Lab notebook\" style=\"padding:32px;border-radius:24px;background:rgba(var(--surface-rgb,18,24,41),0.5);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--ink-rgb,242,245,255),0.09);display:flex;flex-direction:column;gap:14px;font-family:'JetBrains Mono',monospace;font-size:15px;line-height:22px;font-weight:500\">\n<span style=\"font-size:13px;letter-spacing:0.08em;color:var(--muted,#9FACC9)\">LAB NOTEBOOK / ENTRY 404<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:120px 1fr;gap:10px 16px;padding-top:14px;border-top:1px solid var(--hair,#2C3757)\">\n<span style=\"color:var(--muted,#9FACC9)\">EXPECTED<\u002Fspan><span>A page<\u002Fspan>\n<span style=\"color:var(--muted,#9FACC9)\">OBSERVED<\u002Fspan><span>Nothing at all<\u002Fspan>\n<span style=\"color:var(--muted,#9FACC9)\">VARIABLE<\u002Fspan><span>The address<\u002Fspan>\n<span style=\"color:var(--muted,#9FACC9)\">RESULT<\u002Fspan><span><span style=\"display:inline-flex;padding:2px 10px;border-radius:999px;background:var(--danger,#FF7A7A);color:var(--on-accent,#0A0E1A);font-size:13px;font-weight:700\">No reaction<\u002Fspan><\u002Fspan>\n<span style=\"color:var(--muted,#9FACC9)\">NEXT STEP<\u002Fspan><span>Try again, change one thing<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fmain>\n\n<footer style=\"position:relative;z-index:1;border-top:1px solid rgba(var(--ink-rgb,242,245,255),0.10);background:rgba(var(--surface-rgb,18,24,41),0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\">\n<div style=\"width:100%;max-width:1440px;margin:0 auto;padding:clamp(48px,6vw,72px) clamp(20px,4vw,48px) 40px;display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px;align-items:flex-start\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:440px\">\n<a href=\"#/\" style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:0.04em;color:var(--brand-ink,#C6F534);text-decoration:none\">GROWND<\u002Fa>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:var(--muted,#9FACC9)\">Run by [TEAM LEAD] on science and experience, [TECH LEAD] on technology and [CONTENT LEAD] on content. Real experiments for ages 5 to 12.<\u002Fp>\n<\u002Fdiv>\n<nav aria-label=\"Footer\" style=\"display:flex;flex-wrap:wrap;gap:0 24px\">\n<a href=\"#/missions\" style=\"min-height:44px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink,#F2F5FF);text-decoration:none\" style-hover=\"color:var(--brand-ink,#C6F534)\">Missions<\u002Fa>\n<a href=\"#/quiz\" style=\"min-height:44px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink,#F2F5FF);text-decoration:none\" style-hover=\"color:var(--brand-ink,#C6F534)\">Scientist quiz<\u002Fa>\n<a href=\"#/lab\" style=\"min-height:44px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink,#F2F5FF);text-decoration:none\" style-hover=\"color:var(--brand-ink,#C6F534)\">The Lab<\u002Fa>\n<a href=\"#/who\" style=\"min-height:44px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink,#F2F5FF);text-decoration:none\" style-hover=\"color:var(--brand-ink,#C6F534)\">Who we are<\u002Fa>\n<a href=\"#/register\" style=\"min-height:44px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink,#F2F5FF);text-decoration:none\" style-hover=\"color:var(--brand-ink,#C6F534)\">Register interest<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<p style=\"margin:0;padding-top:24px;border-top:1px solid var(--hair,#2C3757);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:18px;font-weight:500;letter-spacing:0.08em;color:var(--muted,#9FACC9)\">CARD PAYMENTS ARE HANDLED BY STRIPE. GROWND NEVER SEES YOUR CARD DETAILS.<\u002Fp>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(88px,21vw,320px);line-height:0.78;letter-spacing:-0.05em;text-align:center;color:transparent;-webkit-text-stroke:1.5px rgba(var(--ink-rgb,242,245,255),0.14);margin-bottom:-0.06em;user-select:none;white-space:nowrap\">GROWND<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  order = ['bio', 'chem', 'phys', 'eng'];\n  T = {\n    bio: { slug: 'biologist', name: 'Biologist', an: 'a', color: 'var(--bio,#35D07F)', initial: 'B', tag: 'You want to know what it is and whether it is alive.', desc: 'You are the one who notices the beetle nobody else saw. You will happily spend an hour on one leaf, and you always want to know what something eats. Biologists at GROWND get the missions with the most looking closely, and occasionally the most mud.', traits: ['Observant', 'Patient', 'Asks what it eats'], recs: ['m03', 'm06'] },\n    chem: { slug: 'chemist', name: 'Chemist', an: 'a', color: 'var(--chem,#FF5CA8)', initial: 'C', tag: 'You want to know what happens when two things meet.', desc: 'You are not scared of a bit of foam, and you are the reason the kitchen smells like that. You would rather try it and find out than read about it first. Chemists at GROWND get the loudest reactions and by far the most colours.', traits: ['Curious', 'Fearless', 'Messy on purpose'], recs: ['m01', 'm06'] },\n    phys: { slug: 'physicist', name: 'Physicist', an: 'a', color: 'var(--phys,#38BDF8)', initial: 'P', tag: 'You want to know why it moved like that.', desc: 'You drop things to see how they fall and you have opinions about which paper aeroplane is best. You like a rule you can test. Physicists at GROWND get the missions with light, speed and things that should not balance but do.', traits: ['Precise', 'Testing everything', 'Likes a rule'], recs: ['m04', 'm02'] },\n    eng: { slug: 'engineer', name: 'Engineer', an: 'an', color: 'var(--eng,#FFA03B)', initial: 'E', tag: 'You want to know how to make a better one.', desc: 'You take things apart, and roughly half of them go back together improved. A failed design does not bother you because version two is already in your head. Engineers at GROWND get the missions where something has to be built and then tested to destruction.', traits: ['Builder', 'Unbothered by failure', 'Already on version two'], recs: ['m02', 'm05'] }\n  };\n  EV = (v, c, left) => ({ d: '[DATE]', t: '[TIME]', tz: '[TIMEZONE]', v: '[VENUE ' + v + ']', c: '[CITY ' + c + ']', ck: 'city-' + c.toLowerCase(), left });\n  M = [\n    { id: 'm01', slug: 'slime-chemistry', no: '01', title: 'Slime Chemistry', type: 'chem', cat: 'Birthday', glyph: 'SLIME', ages: '5-8', mins: 90, cap: 20, unit: 'child',\n      line: 'Polymers, cross-links and a colour they choose themselves. Everyone goes home with a pot.',\n      para: 'Ninety minutes of genuine polymer chemistry, disguised as the best mess of their life. Everyone mixes their own, picks their own colour, and takes a pot home with the recipe card that made it.',\n      steps: [['Meet the polymer.', 'Two liquids go in. Something that is neither liquid nor solid comes out. We explain why, badly, then properly.'], ['Break it on purpose.', 'Pull it slowly, pull it fast. Same slime, completely different behaviour. This is the bit they remember.'], ['Run the variable.', 'Each child changes one thing: more cross-linker, glitter, foam beads. They compare results as a group.'], ['Take it home.', 'Labelled pot, their name, their recipe card. The recipe card is the bit parents thank us for.']],\n      incl: ['Two GROWND scientists for the full session', 'All equipment, materials and protective kit', 'A take-home pot and recipe card per child', 'Setup and full clean-up, including the ceiling'],\n      worth: ['We need a table per six children and a tap nearby', 'Old clothes. We provide aprons, they are not magic', 'Tell us about allergies when you book', '[INSURANCE AND DBS DETAILS]'],\n      events: [['A', 'A', 4], ['B', 'B', 11], ['C', 'C', 0]] },\n    { id: 'm02', slug: 'rocket-engineering', no: '02', title: 'Rocket Engineering', type: 'eng', cat: 'Workshop', glyph: 'LAUNCH', ages: '7-11', mins: 120, cap: 24, unit: 'child',\n      line: 'Design it, launch it, argue about why it went sideways, build a better one.',\n      para: 'Two hours of design, launch and redesign. Every child builds a rocket, launches it properly, and then works out what to change. Nobody gets it right first time, which is the entire point.',\n      steps: [['Draw the thing.', 'Fins, nose cone, mass. We give them the constraints and let them argue about the rest.'], ['Build it.', 'Cutting, taping, weighing. The first build is always too heavy and they find that out themselves.'], ['Launch it.', 'Outside, pressure launcher, measured heights. Everyone gets two launches on the board.'], ['Version two.', 'One change each, relaunch, compare. The improvement is the result, not the height.']],\n      incl: ['Two GROWND scientists and a pressure launcher', 'All build materials and safety kit', 'Their rocket to take home', 'A launch log with every height recorded'],\n      worth: ['This one needs outdoor space, roughly 15 metres clear', 'Wet weather: we run the build indoors and launch another day', 'Ear defenders available for children who want them', '[INSURANCE AND DBS DETAILS]'],\n      events: [['A', 'A', 4], ['B', 'B', 9]] },\n    { id: 'm03', slug: 'crime-scene-biology', no: '03', title: 'Crime Scene Biology', type: 'bio', cat: 'School event', glyph: 'CASE 01', ages: '8-12', mins: 90, cap: 32, unit: 'class',\n      line: 'Fingerprints, fibres and one very suspicious sandwich. The class solves it together.',\n      para: 'A staged scene, real forensic technique and a class that has to agree on an answer. They lift prints, compare fibres, and work through the evidence until only one suspect is left.',\n      steps: [['Walk the scene.', 'They see it before we say anything. First job is writing down what they noticed.'], ['Lift the prints.', 'Powder, tape, card. Then match against the suspect set, which is harder than it looks.'], ['Compare fibres.', 'Hand lenses and a fibre board. This is where the confident answer usually falls apart.'], ['Make the case.', 'The class has to agree, out loud, on who did it and which evidence proves it.']],\n      incl: ['Two GROWND scientists and a full staged scene', 'Evidence kits for the whole class', 'Suspect files and a fibre board', 'A follow-up sheet for the teacher'],\n      worth: ['Works best in a hall or a cleared classroom', 'Up to 32 children in one sitting', 'We can run it twice in a morning for two classes', '[INSURANCE AND DBS DETAILS]'],\n      events: [['B', 'B', 32], ['C', 'C', 0]] },\n    { id: 'm04', slug: 'light-and-lasers', no: '04', title: 'Light and Lasers', type: 'phys', cat: 'Workshop', glyph: 'PRISM', ages: '7-12', mins: 90, cap: 20, unit: 'child',\n      line: 'Bend light, split it, bounce it round a maze and make something glow in the dark.',\n      para: 'A dark room, a lot of mirrors and one laser maze that gets harder every round. They split white light, bend a beam through water, and finish by making something glow that should not.',\n      steps: [['Split the light.', 'Prisms and a white beam. Everyone gets a rainbow on a wall and then has to explain it.'], ['Bend the beam.', 'A laser through water, then through sugar water. Same laser, different bend, no explanation given yet.'], ['Build the maze.', 'Mirrors on a board, target at the far end. In teams, against the clock.'], ['Make it glow.', 'UV and fluorescence. They take home something that stores light and gives it back.']],\n      incl: ['Two GROWND scientists and all optical kit', 'Class-1 safe lasers only, fully supervised', 'A take-home glow item per child', 'Blackout kit if the room needs it'],\n      worth: ['We need a room we can make properly dark', 'Not suitable alongside a disco or strobe lighting', 'Tell us about photosensitivity when you book', '[INSURANCE AND DBS DETAILS]'],\n      events: [['A', 'A', 6]] },\n    { id: 'm05', slug: 'build-a-game-in-scratch', no: '05', title: 'Build a Game in Scratch', type: 'eng', cat: 'Coding', glyph: 'RUN()', ages: '8-12', mins: 120, cap: 16, unit: 'child',\n      line: 'From blank screen to a game they can actually play, in one session.',\n      para: 'Two hours from empty project to a working game with a score, a losing condition and at least one sound effect they regret. They leave with a link so they can keep building at home.',\n      steps: [['Make something move.', 'Sprite, arrow keys, movement. Five minutes in, everyone has something responding to them.'], ['Add a reason to care.', 'A score, a timer, something to collect. This is where it stops being a demo and starts being a game.'], ['Break it deliberately.', \"They swap machines and try to break each other's game. Then they fix their own.\"], ['Ship it.', 'A shareable link each. They keep the project and can carry on the same evening.']],\n      incl: ['One GROWND scientist per eight children', 'Laptops if the venue has none', 'A shareable project link per child', 'A what-to-build-next sheet'],\n      worth: ['Needs wifi that will take sixteen devices', 'Sixteen children maximum, so everyone gets help', 'No previous coding needed, genuinely', '[INSURANCE AND DBS DETAILS]'],\n      events: [] },\n    { id: 'm06', slug: 'glow-lab', no: '06', title: 'Glow Lab', type: 'chem', cat: 'Seasonal event', glyph: 'GLOW', ages: '5-10', mins: 90, cap: 24, unit: 'child',\n      line: 'Dry ice, UV paint and reactions that look far more dangerous than they are.',\n      para: 'Our seasonal mission. Dry ice fog, UV-reactive paint and a set of colour-change reactions built for a dark room and a crowd. Loud, bright and genuinely chemistry the whole way through.',\n      steps: [['Fog the room.', 'Dry ice in warm water. We explain sublimation while they cannot see each other.'], ['Paint under UV.', 'Invisible in daylight, loud under the lamp. Everyone makes a badge for themselves.'], ['Change the colour.', 'Indicator chemistry with red cabbage. It goes through four colours and they call each one.'], ['The last reaction.', 'One big finale reaction, done by us, watched by them, from a sensible distance.']],\n      incl: ['Two GROWND scientists and all dry ice handling', 'UV lamps, paint and badges', 'A take-home glow badge per child', 'Full clean-up'],\n      worth: ['Needs ventilation and a room we can darken', 'Dry ice is handled only by GROWND staff', 'Loud finale: ear defenders available on request', '[INSURANCE AND DBS DETAILS]'],\n      events: [['A', 'A', 0], ['B', 'B', 14]] }\n  ];\n  Q = [\n    { q: 'You find a strange box buried in the garden. What do you do first?', a: ['Check whether something is living in it', 'Pour something on it and see what happens', 'Work out how heavy it is, then drop it', 'Take it apart and build a better one'] },\n    { q: 'Your experiment goes very wrong. Honestly, how do you feel?', a: ['Worried about the woodlice', 'Deligh
